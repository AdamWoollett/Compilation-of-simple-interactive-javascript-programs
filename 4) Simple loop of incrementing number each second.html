<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 9.5 testing</title>
</head>
<body>
    <script>

let count = 0;						
							
let intervalId = setInterval(() => {			
	console.log(`Count is: ${count}`);		
	count++;					
	if (count === 10) {				
		clearInterval(intervalId);		
	}						
}, 1000);	
    </script>
	<h3>Check console logs for counter that increases by 1 each second.</h3>
</body>
</html>
